<title>Willow's Daily Board &mdash; Rocky Mountain Care</title>
<style>
:root { --paper:#F7F6F1; --card:#FFFFFF; --ink:#232E2B; --ink-2:#5A6661; --line:#E2E1D8;
  --accent:#33604F; --crit:#A84532; }
@media (prefers-color-scheme: dark) { :root { --paper:#151B18; --card:#1D2420; --ink:#E5E7E0;
  --ink-2:#A8B2AB; --line:#2E3833; --accent:#7FB39A; --crit:#E08A76; } }
:root[data-theme="dark"] { --paper:#151B18; --card:#1D2420; --ink:#E5E7E0;
  --ink-2:#A8B2AB; --line:#2E3833; --accent:#7FB39A; --crit:#E08A76; }
:root[data-theme="light"] { --paper:#F7F6F1; --card:#FFFFFF; --ink:#232E2B;
  --ink-2:#5A6661; --line:#E2E1D8; --accent:#33604F; --crit:#A84532; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--paper); color:var(--ink);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
.gate { background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:34px 36px; max-width:380px; width:calc(100% - 40px); }
h1 { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:24px; font-weight:600; margin:0 0 4px; }
.sub { color:var(--ink-2); font-size:13.5px; margin:0 0 22px; }
label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-2); margin-bottom:6px; }
input[type=password] { width:100%; box-sizing:border-box; font:inherit; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
input[type=password]:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.row { display:flex; align-items:center; gap:8px; margin:14px 0 18px; font-size:13.5px; color:var(--ink-2); }
button { width:100%; font:inherit; font-weight:600; color:#fff; background:var(--accent);
  border:none; border-radius:8px; padding:11px; cursor:pointer; }
button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.err { color:var(--crit); font-size:13.5px; min-height:18px; margin:10px 0 0; }
.foot { color:var(--ink-2); font-size:12px; margin-top:18px; }
</style>
<div class="gate">
  <h1>Willow's Daily Board</h1>
  <p class="sub">Rocky Mountain Care &middot; This board is encrypted. Enter the passphrase to open it.</p>
  <form id="f">
    <label for="pw">Passphrase</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <div class="row"><input type="checkbox" id="rem"><label for="rem" style="all:unset;cursor:pointer">Remember on this device</label></div>
    <button type="submit">Open board</button>
    <p class="err" id="err"></p>
  </form>
  <p class="foot">Locked out? Text Spencer at Medicaidsoft for the passphrase.</p>
</div>

async function tryOpen(pw) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: fromB64(SALT), iterations: 310000, hash: "SHA-256" },

document.getElementById("f").addEventListener("submit", async e => {
